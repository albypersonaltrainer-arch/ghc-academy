name: GAVE Documentary Doramas Pilot

on:
  push:
    branches: [gave/documentary-v1]
    paths:
      - '.github/workflows/gave-documentary-doramas-pilot.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gave/documentary-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q piper-tts

      - name: Build directed documentary job from PDF-extracted narration
        run: |
          mkdir -p gave/runs/documentary_doramas_pilot_01
          python - <<'PY'
          import json
          from pathlib import Path
          narration=Path('gave/documentary/tests/doramas_pilot_01.txt').read_text(encoding='utf-8').strip()
          paras=[p.strip() for p in narration.split('\n\n') if p.strip()]
          queries=[
              'Gran Canaria Canary Islands landscape',
              'Galdar Gran Canaria Canary Islands',
              'Canary Islands old map Gran Canaria',
              'Parque Rural de Doramas Gran Canaria',
              'Telde Gran Canaria Canary Islands',
              'Gran Canaria old map Canary Islands',
              'Las Palmas de Gran Canaria historic',
              'Gran Canaria mountains barranco landscape',
              'Galdar Gran Canaria archaeology Canary Islands',
          ]
          total_words=sum(len(p.split()) for p in paras)
          beats=[]
          for i,(para,query) in enumerate(zip(paras,queries),1):
              words=len(para.split())
              dur=350.0*words/total_words
              beats.append({
                  'id':f'B{i:03d}','narration':para,'searchQuery':query,
                  'tone':'BLACK_AND_WHITE' if i in {1,3,6,7} else 'COLOR',
                  'durationSeconds':round(dur,3),'assetCount':2,
                  'movementCycle':['SLOW_PUSH','PAN_RIGHT','DETAIL_PUSH','SLOW_PULL'],
              })
          job={
              'schema':'GAVE_DOCUMENTARY_JOB_V1','title':'Doramas - Del hombre común al caudillo',
              'language':'es','narrationText':narration,'targetDurationSeconds':350.0,
              'sourceDocument':'Doramas_historia_conquista_Gran_Canaria_4_folios.pdf',
              'pilotScope':'PDF pages 1 and opening of page 2; 5-6 minute representative microdocumentary',
              'style':{'reference':'premium historical documentary','resolution':'1920x1080','fps':25,
                       'defaultShotSeconds':10.0,'subtitleLanguage':'es',
                       'colorStrategy':'intentional B&W history beats mixed with documentary color'},
              'safety':{'realMediaOnly':True,'aiGeneratedMediaAllowed':False,'paidAssetsAllowed':False,
                        'commercialUseRequired':True,'modificationRequired':True,'productionTouched':False},
              'sourceOrder':['wikimedia'],'beats':beats,
          }
          Path('gave/runs/documentary_doramas_pilot_01/job.json').write_text(
              json.dumps(job,ensure_ascii=False,indent=2),encoding='utf-8')
          print('DIRECTED_BEATS',len(beats),'WORDS',total_words)
          PY

      - name: Discover strictly licensed real images
        run: |
          python -m gave.documentary.pipeline discover \
            --job gave/runs/documentary_doramas_pilot_01/job.json \
            --out gave/runs/documentary_doramas_pilot_01/asset_ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('gave/runs/documentary_doramas_pilot_01')
          job=json.loads((root/'job.json').read_text(encoding='utf-8'))
          ledger=json.loads((root/'asset_ledger.json').read_text(encoding='utf-8'))
          counts={b['id']:0 for b in job['beats']}
          for i in ledger['items']:
              counts[i['beatId']]+=1
          print('approved assets',len(ledger['items']),'counts',counts)
          missing=[bid for bid,n in counts.items() if n < 1]
          if missing:
              raise SystemExit('Asset discovery incomplete: '+','.join(missing))
          for item in ledger['items']:
              a=item['asset']
              assert a['policyAccepted'] is True
              assert a['commercialUse'] is True
              assert a['modificationAllowed'] is True
              assert a.get('aiGenerated') is not True
          PY

      - name: Download approved assets and hash provenance
        run: |
          python -m gave.documentary.pipeline download \
            --ledger gave/runs/documentary_doramas_pilot_01/asset_ledger.json \
            --asset-dir gave/runs/documentary_doramas_pilot_01/assets

      - name: Generate zero-cost Spanish pilot voice with Piper
        run: |
          piper --model es_ES-davefx-medium \
            --output_file gave/runs/documentary_doramas_pilot_01/narration.wav \
            < gave/documentary/tests/doramas_pilot_01.txt

      - name: Render 1080p documentary with selectable Spanish subtitles
        run: |
          python -m gave.documentary.pipeline render \
            --job gave/runs/documentary_doramas_pilot_01/job.json \
            --ledger gave/runs/documentary_doramas_pilot_01/asset_ledger.json \
            --narration-audio gave/runs/documentary_doramas_pilot_01/narration.wav \
            --out gave/runs/documentary_doramas_pilot_01/doramas_documentary_pilot_v1.mp4

      - name: Final safety and media validation
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('gave/runs/documentary_doramas_pilot_01')
          state=json.loads((root/'doramas_documentary_pilot_v1.state.json').read_text(encoding='utf-8'))
          ledger=json.loads((root/'asset_ledger.json').read_text(encoding='utf-8'))
          assert state['realMediaOnly'] is True
          assert state['aiGeneratedMediaUsed'] is False
          assert state['paidAssetsUsed'] is False
          assert state['productionTouched'] is False
          assert state['subtitleTrackIncluded'] is True
          assert all(i.get('sha256') for i in ledger['items'])
          probe=subprocess.check_output([
              'ffprobe','-v','error','-show_entries','stream=codec_type,codec_name:format=duration',
              '-of','json',str(root/'doramas_documentary_pilot_v1.mp4')
          ],text=True)
          print(probe)
          data=json.loads(probe)
          types=[s.get('codec_type') for s in data['streams']]
          assert 'video' in types and 'audio' in types and 'subtitle' in types
          print('GAVE_DORAMAS_PILOT_PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gave-doramas-documentary-pilot-v1
          path: |
            gave/runs/documentary_doramas_pilot_01/doramas_documentary_pilot_v1.mp4
            gave/runs/documentary_doramas_pilot_01/doramas_documentary_pilot_v1.state.json
            gave/runs/documentary_doramas_pilot_01/asset_ledger.json
            gave/runs/documentary_doramas_pilot_01/job.json
            gave/runs/documentary_doramas_pilot_01/doramas_documentary_pilot_v1_work/subtitles_es.srt
          retention-days: 7
