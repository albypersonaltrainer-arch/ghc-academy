name: GAVE First Day Assembly

on:
  push:
    branches:
      - gave/wan22-t2v-test-01
    paths:
      - '.github/workflows/gave-first-day-assembly.yml'
      - 'gave/finalize_first_day.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experimental GAVE branch
        uses: actions/checkout@v4

      - name: Verify FFmpeg is available
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Assemble 30s picture lock with no audio
        run: python -u gave/finalize_first_day.py

      - name: Enforce GAVE safety state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('gave/runs/wan22_ti2v_test_01_first_day/online/picture_lock_state.json')
          d = json.loads(p.read_text())
          assert d['status'] == 'PICTURE_LOCK_V1'
          assert d['shotCount'] == 8
          assert abs(float(d['durationSeconds']) - 30.0) < 0.20
          assert d['paidInferenceUsed'] is False
          assert d['actualSpendEur'] == 0
          assert d['imageGenerationUsed'] is False
          assert d['imageToVideoUsed'] is False
          assert d['productionTouched'] is False
          assert Path(d['output']).exists()
          print('GAVE PICTURE LOCK SAFETY: PASS')
          PY

      - name: Persist assembly on experimental branch
        run: |
          rm -rf gave/runs/wan22_ti2v_test_01_first_day/online/_assembly
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gave/runs/wan22_ti2v_test_01_first_day/online/shot_001_wake.mp4
          git add gave/runs/wan22_ti2v_test_01_first_day/online/first_day_picture_lock_v1.mp4
          git add gave/runs/wan22_ti2v_test_01_first_day/online/picture_lock_state.json
          git commit -m 'test(gave): persist First Day 30s picture lock' || exit 0
          git pull --rebase origin gave/wan22-t2v-test-01
          git push origin HEAD:gave/wan22-t2v-test-01
