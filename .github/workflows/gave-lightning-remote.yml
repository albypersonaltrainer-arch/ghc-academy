name: GAVE Lightning Remote Generation

on:
  workflow_dispatch:
  push:
    branches:
      - gave/wan22-t2v-test-01
    paths:
      - gave/control/lightning_request.json

permissions:
  contents: read

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit != null }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GAVE_ALLOW_PAID: "false"
      LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
      LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
      LIGHTNING_ORG: GAVE
      LIGHTNING_TEAMSPACE: deploy-model-project
      LIGHTNING_STUDIO: deploy-model-devbox

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: gave/wan22-t2v-test-01

      - name: Validate GAVE request safety
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('gave/control/lightning_request.json').read_text())
          assert request.get('paidInferenceAllowed') is False
          assert float(request.get('actualSpendEur', -1)) == 0
          assert request.get('productionAllowed') is False
          assert request.get('imageGenerationAllowed') is False
          assert request.get('imageToVideoAllowed') is False
          if not request.get('enabled', False):
              print('GAVE Lightning request is disabled; no GPU action will run.')
              raise SystemExit(78)
          print('GAVE Lightning request safety: PASS')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lightning SDK
        run: python -m pip install --upgrade lightning-sdk

      - name: Validate Lightning credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          uid = os.environ.get('LIGHTNING_USER_ID', '').strip()
          key = os.environ.get('LIGHTNING_API_KEY', '').strip()
          if not uid:
              raise SystemExit('Missing LIGHTNING_USER_ID secret')
          if not key:
              raise SystemExit('Missing LIGHTNING_API_KEY secret')
          for name, value in [('LIGHTNING_USER_ID', uid), ('LIGHTNING_API_KEY', key)]:
              if '*' in value:
                  raise SystemExit(f'{name} contains asterisks: masked display value was saved instead of the real credential')
              if '=' in value or 'lightning login' in value.lower() or name + '=' in value:
                  raise SystemExit(f'{name} appears to contain the assignment/CLI command instead of only the credential value')
          print(f'Lightning credential shape: PASS uid_len={len(uid)} key_len={len(key)}')
          PY

      - name: Generate remotely and recover MP4
        run: python gave/remote_worker/lightning/orchestrate_lightning.py

      - name: Upload GAVE result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gave-lightning-video
          path: artifacts/lightning/
          if-no-files-found: warn
          retention-days: 7
