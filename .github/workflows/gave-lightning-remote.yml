name: GAVE Lightning Remote Generation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GAVE_ALLOW_PAID: "false"
      LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
      LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
      LIGHTNING_ORG: GAVE
      LIGHTNING_TEAMSPACE: deploy-model-project
      LIGHTNING_STUDIO: deploy-model-devbox

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: gave/wan22-t2v-test-01

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lightning SDK
        run: python -m pip install --upgrade lightning-sdk

      - name: Validate Lightning credentials
        shell: bash
        run: |
          test -n "$LIGHTNING_USER_ID" || { echo "Missing LIGHTNING_USER_ID secret"; exit 20; }
          test -n "$LIGHTNING_API_KEY" || { echo "Missing LIGHTNING_API_KEY secret"; exit 21; }

      - name: Generate remotely and recover MP4
        run: python gave/remote_worker/lightning/orchestrate_lightning.py

      - name: Upload GAVE result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gave-lightning-video
          path: artifacts/lightning/
          if-no-files-found: warn
          retention-days: 7
