name: GAVE Wan Directed V2

on:
  push:
    branches:
      - gave/wan22-t2v-test-01
    paths:
      - 'gave/control/run_online_batch_v2.json'
      - 'gave/tests/wan22_ti2v_test_02_first_day_directed.json'
      - '.github/workflows/gave-wan-online-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gave-wan-directed-v2
  cancel-in-progress: false

jobs:
  generate-directed-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAVE_SPACE: Upsampler/wan-2-2-5b-video
      GAVE_MANIFEST: gave/tests/wan22_ti2v_test_02_first_day_directed.json
      GAVE_CONTROL: gave/control/run_online_batch_v2.json
      GAVE_OUT: gave/runs/wan22_ti2v_test_02_first_day/online
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout experimental GAVE branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install online client only
        run: pip install -r gave/requirements.txt

      - name: Validate directorial manifest and safety guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('gave/tests/wan22_ti2v_test_02_first_day_directed.json').read_text())
          assert m['paidInferenceAllowed'] is False
          assert m['productionAllowed'] is False
          assert m['imageGenerationAllowed'] is False
          assert m['imageToVideoAllowed'] is False
          assert m['actualSpendEur'] == 0
          assert m['storyRule'].find('SHOT_010') >= 0
          shots = m['shots']
          assert len(shots) == 14
          ids = [s['id'] for s in shots]
          assert len(ids) == len(set(ids))
          for s in shots:
              assert s['durationSeconds'] <= 3.5
              assert s.get('primaryAction')
              assert s.get('wardrobeState') in {'STREET_OUTFIT','CHANGE_PREP','TRAINER_OUTFIT'}
              assert s.get('mustShow')
              assert s.get('mustNotShow') is not None
          reveal = next(s for s in shots if s['id'] == 'V2_010_GYM_REVEAL')
          change = next(s for s in shots if s['id'] == 'V2_012_AFTER_CHANGE')
          assert reveal['criticalQaGate'] == 'REJECT_IF_GYM_NOT_UNMISTAKABLE'
          assert change['criticalQaGate'] == 'REJECT_IF_ANY_CLOTHING_MORPH_OCCURS'
          print('GAVE DIRECTORIAL V2 STATIC QA: PASS')
          PY

      - name: Confirm HF token without exposing it
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN missing"
            exit 1
          fi
          echo "HF_TOKEN present: yes (hidden)"

      - name: Generate selected V2 shot via Free-account Wan T2V
        run: python -u gave/run_online_batch.py

      - name: Persist V2 outputs and state
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gave/runs/wan22_ti2v_test_02_first_day/online 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No V2 assets/state to persist."
            exit 0
          fi
          git commit -m 'test(gave): persist directed V2 Wan output'
          git pull --rebase origin gave/wan22-t2v-test-01
          git push origin HEAD:gave/wan22-t2v-test-01

      - name: Enforce zero-cost T2V state
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('gave/runs/wan22_ti2v_test_02_first_day/online/batch_state.json')
          if not p.exists():
              raise SystemExit('No V2 batch_state.json produced')
          d = json.loads(p.read_text())
          assert d['paidInferenceUsed'] is False
          assert d['actualSpendEur'] == 0
          assert d['imageGenerationUsed'] is False
          assert d['imageToVideoUsed'] is False
          assert d['productionTouched'] is False
          print('GAVE DIRECTED V2 ZERO-COST/T2V SAFETY: PASS')
          PY
